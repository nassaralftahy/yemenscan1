id: kubeconfig-exposure
info:
  name: Kubernetes Cluster Configuration File Exposure
  author: YemenScan-Core
  severity: critical
  description: ملف إعدادات كتلة Kubernetes متاح للعامة (.kube/config) متضمناً شهادات
    الوصول الإداري لعناقيد الحاويات.
  remediation: حذف ملف الإعداد وحظر مجلد .kube وتجديد شهادات المصادقة الخاصة بمجموعات
    K8s.
  tags:
  - exposure
  - k8s
  - kubernetes
  - cloud
  - critical
http:
- method: GET
  path:
  - '{{BaseURL}}/.kube/config'
  - '{{BaseURL}}/kubeconfig'
  matchers-condition: and
  matchers:
  - type: word
    words:
    - 'apiVersion: v1'
    - 'clusters:'
    - certificate-authority-data
  - type: status
    status:
    - 200
