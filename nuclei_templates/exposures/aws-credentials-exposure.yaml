id: aws-credentials-exposure
info:
  name: AWS Cloud Credentials & Config File Leak
  author: YemenScan-Core
  severity: critical
  description: تسريب ملف بيانات الاعتماد السحابية لأمازون .aws/credentials مما يتيح
    للمهاجم الاستيلاء على موارد السحابة.
  remediation: حظر الوصول لمجلد .aws وإلغاء وتدوير كافة مفاتيح الوصول لـ AWS فوراً.
  tags:
  - exposure
  - aws
  - cloud
  - credentials
  - critical
http:
- method: GET
  path:
  - '{{BaseURL}}/.aws/credentials'
  - '{{BaseURL}}/.aws/config'
  matchers-condition: and
  matchers:
  - type: word
    words:
    - aws_access_key_id
    - aws_secret_access_key
  - type: status
    status:
    - 200
