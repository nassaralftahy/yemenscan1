id: laravel-log-leak
info:
  name: Laravel Application Execution Log Leak (laravel.log)
  author: YemenScan-Core
  severity: high
  description: ملف سجلات Laravel متاح للتنزيل المباشر، متضمناً أخطاء التطبيق والاستعلامات
    وبيانات الاعتماد الحساسة.
  remediation: منع الوصول لمجلد storage وحظر تنزيل ملفات .log في خادم الويب.
  tags:
  - php
  - laravel
  - logs
http:
- method: GET
  path:
  - '{{BaseURL}}/storage/logs/laravel.log'
  matchers-condition: and
  matchers:
  - type: word
    words:
    - '.INFO: '
    - '.ERROR: '
    - production.ERROR
  - type: status
    status:
    - 200
