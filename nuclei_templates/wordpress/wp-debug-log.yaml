id: wp-debug-log
info:
  name: WordPress Debug Log Sensitive Error Leak (debug.log)
  author: YemenScan-Core
  severity: high
  description: ملف سجل الأخطاء wp-content/debug.log متاح للتحميل العام، مما يكشف عن
    استعلامات SQL وأخطاء الإضافات والمسارات الحساسة.
  remediation: تعطيل WP_DEBUG_LOG في wp-config.php أو حظر الوصول لملفات .log من خادم
    الويب.
  tags:
  - wordpress
  - logs
  - debug
http:
- method: GET
  path:
  - '{{BaseURL}}/wp-content/debug.log'
  matchers-condition: and
  matchers:
  - type: word
    words:
    - PHP Fatal error
    - PHP Notice
    - WordPress database error
  - type: status
    status:
    - 200
